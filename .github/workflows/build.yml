name: Android APK and backend checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - run: ./android/gradlew -p android assembleDebug testDebugUnitTest
      - run: |
          mkdir apk
          cp android/app/build/outputs/apk/debug/app-debug.apk apk/open-pocket-debug.apk
          (cd apk && sha256sum open-pocket-debug.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: open-pocket-debug-apk
          path: apk/
          if-no-files-found: error
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: uv run --locked --project backend pytest backend/tests
      - run: python3 .kodi/qa.py
